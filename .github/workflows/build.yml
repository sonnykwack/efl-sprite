name: build

# Every push builds the app on macOS and Windows, so a change that breaks one OS
# is caught the same day — not on submission day.
# A version tag (v0.1.0, …) additionally publishes the executables to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create/upload GitHub Releases on version tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest       # Apple Silicon
            bundle: src-tauri/target/release/bundle/macos
          - name: windows
            runner: windows-latest
            bundle: src-tauri/target/release/bundle/nsis
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Engines are cached per OS and per fetch-script version; bump the script
      # (or clear the cache) to pick up new llama.cpp / whisper.cpp releases.
      - name: Cache engines
        id: engines
        uses: actions/cache@v4
        with:
          path: src-tauri/engines/${{ matrix.name }}
          key: engines-${{ matrix.name }}-${{ hashFiles('scripts/fetch-engines.mjs') }}

      - run: npm ci

      - name: Fetch engines
        if: steps.engines.outputs.cache-hit != 'true'
        run: npm run fetch-engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app
        run: npx tauri build

      # Microsoft Store package (see scripts/make-msix.ps1). Unsigned → Partner Center,
      # *_test.msix + .cer → local install test.
      - name: Build MSIX
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/make-msix.ps1

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: efl-sprite-msix
          path: src-tauri/target/release/msix
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: efl-sprite-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

      # ---------- GitHub Release (version tags only)
      - name: Collect release files (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/EFL Sprite.app" \
            "dist/EFL-Sprite_${GITHUB_REF_NAME#v}_macOS-AppleSilicon.zip"

      - name: Collect release files (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item src-tauri/target/release/msix/*_test.msix dist/
          Copy-Item src-tauri/target/release/msix/EFL-Sprite-test.cer dist/

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          # Both OS jobs reach this step; whichever comes second finds the release already there.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "EFL Sprite ${GITHUB_REF_NAME}" --notes-file "$notes" || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
