[package]
name = "efl-sprite"
version = "0.1.0"
description = "EFL Sprite — on-device speaking & writing coach"
authors = ["Xogns"]
edition = "2021"
rust-version = "1.77"

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and the bin target.
name = "efl_sprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON schemas keep their key order on the way to llama-server, so the
# grammar makes the model write `evidence` BEFORE `score` (see docs/development.md, scoring design).
serde_json = { version = "1", features = ["preserve_order"] }
# `bundled` compiles SQLite into the binary: identical behaviour on macOS and Windows,
# no system DLL needed inside the MSIX package.
rusqlite = { version = "0.32", features = ["bundled"] }
# rustls instead of native TLS → no OpenSSL/Schannel differences between platforms.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "process"] }
futures-util = "0.3"
# Grammar model (GECToR, ONNX). `load-dynamic`: the ONNX Runtime library is fetched per OS
# by `npm run fetch-engines` and loaded at runtime — nothing is downloaded at compile time.
# api-20 = works with any ONNX Runtime >= 1.20.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-20"] }
# Pure-Rust regex backend (no C/C++ build) → identical builds on macOS and Windows.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
