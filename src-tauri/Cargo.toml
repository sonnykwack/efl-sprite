[package]
name = "efl-sprite"
version = "0.1.0"
description = "EFL Sprite — on-device speaking & writing coach"
authors = ["Xogns"]
edition = "2021"
rust-version = "1.77"

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and the bin target.
name = "efl_sprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite into the binary: identical behaviour on macOS and Windows,
# no system DLL needed inside the MSIX package.
rusqlite = { version = "0.32", features = ["bundled"] }
# rustls instead of native TLS → no OpenSSL/Schannel differences between platforms.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "process"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
